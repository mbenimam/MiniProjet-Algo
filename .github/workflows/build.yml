name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Unit tests and smoke runs
        run: make test

      - name: Tests under AddressSanitizer and UBSan
        run: make test-asan
